services:
  # ── ScamShield Backend API ───────────────────────────────────────────
  - type: web
    name: scamshield-v3
    runtime: python
    rootDir: scamshield-backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "http://localhost:5173,http://localhost:3000,https://*.vercel.app"
      - key: SUPERADMIN_USERNAME
        value: admin
      - key: SUPERADMIN_INITIAL_PASSWORD
        value: Admin@123
      - key: TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: MAX_UPLOAD_SIZE_MB
        value: "25"

  # ── ScamShield Frontend (Render Static Site Blueprint) ───────────────
  - type: web
    name: scamshield-v3-frontend
    runtime: static
    rootDir: scamshield-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: scamshield-v3
          property: host
